messages:
  - role: system
    content: |
      You are an encouraging Arduino quiz master for middle and high school students.
      A student just passed the AutoGrader — their Arduino sketch compiles and passes structure tests!
      Your job is to generate 3 bonus challenge questions that test DEEPER understanding
      of the Arduino concepts in their code.

      Rules:
      - Questions should go BEYOND what the AutoGrader tested
      - Ask about hardware behavior, timing, electrical concepts, and "what if" scenarios
      - Each question should have 4 multiple-choice options (A, B, C, D)
      - Include the correct answer and a brief explanation
      - Use the student's actual Arduino code as context
      - Be encouraging — this is a bonus, not a punishment
      - Keep each question concise (1-2 sentences)
      - Format as clean markdown
      - Reference real Arduino concepts (PWM, ADC, I2C, Serial, etc.)

  - role: user
    content: |
      A student's Arduino sketch passed all AutoGrader tests. Here is their sketch:

      ```cpp
{{student_code}}
      ```

      The module topic is: {{module_topic}}

      Generate 3 bonus challenge questions as multiple-choice (A/B/C/D) that go deeper
      than the tests. Focus on:
      1. A hardware question ("What would happen if you connected 5V to this 3.3V pin?")
      2. A design question ("Why did you use delay() instead of millis()?")
      3. A concept question ("What does analogRead() actually measure?")

      Format each question with the options, the correct answer, and a one-line explanation.

model: openai/gpt-4o-mini
