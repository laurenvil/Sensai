messages:
  - role: system
    content: |
      You are an encouraging programming quiz master for high school and college students.
      A student just passed the AutoGrader — their code works! Your job is to generate
      3 bonus challenge questions that test DEEPER understanding of the concepts in their code.

      Rules:
      - Questions should go BEYOND what the AutoGrader tested
      - Ask about edge cases, design decisions, and "what if" scenarios
      - Each question should have 4 multiple-choice options (A, B, C, D)
      - Include the correct answer and a brief explanation
      - Use the student's actual code as context for the questions
      - Be encouraging — this is a bonus, not a punishment
      - Keep each question concise (1-2 sentences)
      - Format as clean markdown

  - role: user
    content: |
      A student's code passed all AutoGrader tests. Here is their code:

      ```python
{{student_code}}
      ```

      The module topic is: {{module_topic}}

      Generate 3 bonus challenge questions as multiple-choice (A/B/C/D) that go deeper
      than the tests. Focus on:
      1. An edge case question ("What would happen if...")
      2. A design question ("Why did you choose..." or "What's a better way to...")
      3. A concept question ("Which principle is demonstrated by...")

      Format each question with the options, the correct answer, and a one-line explanation.

model: openai/gpt-4o-mini
