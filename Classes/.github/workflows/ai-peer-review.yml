name: AI Review Facilitator

on:
  pull_request:
    types: [opened]

jobs:
  facilitate-review:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'

    permissions:
      pull-requests: write
      contents: read
      models: read

    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gather PR context
        id: context
        run: |
          # Get changed files
          git diff origin/main...HEAD --name-only > changed_files.txt
          CHANGED_FILES=$(cat changed_files.txt | tr '\n' ', ')
          echo "changed_files=$CHANGED_FILES" >> $GITHUB_OUTPUT
          echo "file_count=$(wc -l < changed_files.txt)" >> $GITHUB_OUTPUT

          # Get diff summary (truncated for token limits)
          DIFF=$(git diff origin/main...HEAD --stat && echo "---" && git diff origin/main...HEAD -- '*.py' '*.md' | head -150)
          echo "diff_summary<<EOF" >> $GITHUB_OUTPUT
          echo "$DIFF" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Generate AI review guidance
        id: ai-review
        uses: actions/ai-inference@v1
        with:
          prompt-file: '.github/prompts/review-guide.prompt.yml'
          input: |
            pr_title: ${{ github.event.pull_request.title }}
            changed_files: ${{ steps.context.outputs.changed_files }}
            pr_description: ${{ github.event.pull_request.body }}
            diff_summary: ${{ steps.context.outputs.diff_summary }}

      - name: Post review guidance and checklist
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prAuthor = context.payload.pull_request.user.login;
            const aiGuidance = `${{ steps.ai-review.outputs.response }}`.replace(/`/g, '\\`');

            const body = `## 👋 Ready for Review — @${prAuthor}

            Great work opening a PR! Here's your review guide.

            ---

            ### ✅ Pre-Review Checklist
            - [ ] AutoGrader is passing (check the status above)
            - [ ] \`learning-contract.md\` exists in repo root
            - [ ] PR description explains what you built
            - [ ] Resource added to \`community-resources/\`

            ---

            ${aiGuidance}

            ---

            ### 📖 How to Give a Great Review
            1. Click **"Files changed"** → read the diff
            2. Click **➕** next to any line to leave a comment
            3. Click **"Review changes"** → **Comment** or **Approve**

            > See [COMMUNITY_GUIDELINES.md](../blob/main/COMMUNITY_GUIDELINES.md) for the Code of Review.

            ---
            *This guidance was generated by AI based on your actual changes to help both sides of the review process.*`;

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

            try {
              await github.rest.issues.addLabels({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                labels: ['needs-peer-review']
              });
            } catch (e) {
              console.log('Label may not exist yet:', e.message);
            }
