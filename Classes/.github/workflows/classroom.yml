name: GitHub Classroom — AutoGrader

on: [push]

permissions:
  checks: write
  actions: read
  contents: read
  pull-requests: write
  models: read

jobs:
  autograde:
    name: AutoGrading
    runs-on: ubuntu-latest

    steps:
      - name: Checkout student repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-json-report

      - name: Run AutoGrader — Module 01 Basics
        id: grader
        uses: classroom-resources/autograding-python-grader@v1
        with:
          setup-command: 'pip install pytest'
          python-test-file: 'curriculum-master/modules/module-01-basics/tests/test_basics.py'

      # Grading reporter posts score as a GitHub Check
      - name: Report grades to GitHub Classroom
        uses: classroom-resources/autograding-grading-reporter@v1
        env:
          GRADER_RESULTS: "${{ steps.grader.outputs.result }}"
        with:
          runners: grader

      # --- AI-Powered Failure Explanation ---
      # If tests failed, explain why in plain English
      - name: Capture test output for AI explanation
        if: failure()
        id: test-output
        run: |
          # Re-run pytest to capture output (the grader step doesn't expose raw output)
          TEST_OUTPUT=$(python -m pytest curriculum-master/modules/module-01-basics/tests/test_basics.py -v --tb=short 2>&1 || true)
          # Indent output by 6 spaces to align with YAML block in prompt file
          INDENTED_TEST_OUTPUT=$(echo "$TEST_OUTPUT" | tail -50 | sed 's/^/      /')
          
          echo "test_output<<EOF" >> $GITHUB_OUTPUT
          echo "$INDENTED_TEST_OUTPUT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          # Also grab the student's code
          STUDENT_CODE=""
          if [ -f "curriculum-master/modules/module-01-basics/starter-code/app.py" ]; then
            STUDENT_CODE=$(cat curriculum-master/modules/module-01-basics/starter-code/app.py | head -100)
          fi
          # Indent code by 6 spaces to align with YAML block in prompt file
          INDENTED_STUDENT_CODE=$(echo "$STUDENT_CODE" | sed 's/^/      /')
          
          echo "student_code<<EOF" >> $GITHUB_OUTPUT
          echo "$INDENTED_STUDENT_CODE" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: AI explains test failure
        if: failure()
        id: ai-explain
        uses: actions/ai-inference@v1
        with:
          prompt-file: '.github/prompts/explain-test-failure.prompt.yml'
          input: >
            {
              "test_output": ${{ toJSON(steps.test-output.outputs.test_output) }},
              "student_code": ${{ toJSON(steps.test-output.outputs.student_code) }}
            }

      - name: Post AI explanation as PR comment
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // Find the PR associated with this push
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${context.ref.replace('refs/heads/', '')}`,
              state: 'open'
            });

            if (prs.length === 0) {
              console.log('No open PR found for this branch — skipping AI comment.');
              return;
            }

            const prNumber = prs[0].number;
            const aiExplanation = `${{ steps.ai-explain.outputs.response }}`;

            const body = `## 🤖 AutoGrader — What Went Wrong

            ${aiExplanation}

            ---
            > 💡 Push a fix and the AutoGrader will run again automatically.
            > Need more help? Check the [resources](curriculum-master/modules/module-01-basics/resources.md) or ask a classmate.

            *This explanation was generated by AI to help you understand the failure. The AutoGrader tests are the source of truth.*`;

            await github.rest.issues.createComment({
              issue_number: prNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body.trim()
            });

      # --- AI-Powered Bonus Quiz (on success) ---
      # When all tests pass, generate dynamic quiz questions from the student's code
      - name: Capture student code for quiz generation
        if: success()
        id: quiz-code
        run: |
          # Gather all student Python files
          STUDENT_CODE=""
          for f in $(find curriculum-master/modules/*/starter-code -name '*.py' 2>/dev/null); do
            STUDENT_CODE="${STUDENT_CODE}
          # --- File: ${f} ---
          $(cat "$f" | head -80)"
          done

          if [ -z "$STUDENT_CODE" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Indent output by 6 spaces to align with YAML block in prompt file
          INDENTED_STUDENT_CODE=$(echo "$STUDENT_CODE" | sed 's/^/      /')

          echo "skip=false" >> $GITHUB_OUTPUT
          echo "student_code<<EOF" >> $GITHUB_OUTPUT
          echo "$INDENTED_STUDENT_CODE" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          # Detect module topic from the first module README
          MODULE_TOPIC="Python programming"
          README=$(find curriculum-master/modules/*/README.md -print -quit 2>/dev/null)
          if [ -f "$README" ]; then
            TITLE=$(head -1 "$README" | sed 's/^#\s*//')
            if [ -n "$TITLE" ]; then
              MODULE_TOPIC="$TITLE"
            fi
          fi
          echo "module_topic=$MODULE_TOPIC" >> $GITHUB_OUTPUT

      - name: Generate AI bonus quiz
        if: success() && steps.quiz-code.outputs.skip != 'true'
        id: ai-quiz
        uses: actions/ai-inference@v1
        with:
          prompt-file: '.github/prompts/generate-quiz.prompt.yml'
          input: >
            {
              "student_code": ${{ toJSON(steps.quiz-code.outputs.student_code) }},
              "module_topic": ${{ toJSON(steps.quiz-code.outputs.module_topic) }}
            }

      - name: Post quiz as PR comment
        if: success() && steps.quiz-code.outputs.skip != 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${context.ref.replace('refs/heads/', '')}`,
              state: 'open'
            });

            if (prs.length === 0) {
              console.log('No open PR found — skipping quiz post.');
              return;
            }

            const prNumber = prs[0].number;
            const quizContent = `${{ steps.ai-quiz.outputs.response }}`;

            const body = `## 🎉 AutoGrader Passed — Bonus Challenge!

            Congrats! All tests are green ✅. While you wait for peer review, try these bonus questions about your code:

            ---

            ${quizContent}

            ---

            > 💡 These are for self-reflection — no grade attached. Discuss them with your peer reviewer!

            *Quiz generated by AI from your actual code.*`;

            await github.rest.issues.createComment({
              issue_number: prNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body.trim()
            });

