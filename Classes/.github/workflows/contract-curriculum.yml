name: 📜 Learning Contract → AI Curriculum

# Triggers when a teacher comments "Approved" on a Learning Contract issue
on:
  issue_comment:
    types: [created]

permissions:
  issues: write
  contents: read
  models: read

jobs:
  generate-curriculum:
    name: Generate Personalized Curriculum
    runs-on: ubuntu-latest

    # Only run when:
    # 1. The issue has the "contract-pending" label (it's a Learning Contract)
    # 2. The comment contains "Approved" (teacher approval)
    # 3. The commenter is NOT the issue author (teacher approving student's contract)
    if: |
      contains(github.event.issue.labels.*.name, 'contract-pending') &&
      contains(github.event.comment.body, 'Approved') &&
      github.event.comment.user.login != github.event.issue.user.login

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse Learning Contract from issue body
        id: parse
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const body = context.payload.issue.body || '';
            const student = context.payload.issue.user.login;

            // Extract chosen path
            let chosenPath = 'A (Guided)';
            if (body.includes('[x] **Path B')) chosenPath = 'B (Explorer)';
            if (body.includes('[x] **Path C')) chosenPath = 'C (Expert)';

            // Extract module name
            const moduleMatch = body.match(/\*\*Module:\*\*\s*(.+)/);
            const moduleName = moduleMatch ? moduleMatch[1].trim() : 'module-01-basics';

            // Extract learning goals (the 3 numbered items after "Learning Goals")
            const goalsSection = body.match(/Learning Goals[\s\S]*?1\.\s*(.*)\n2\.\s*(.*)\n3\.\s*(.*)/);
            let goals = 'Not specified';
            if (goalsSection) {
              goals = `1. ${goalsSection[1].trim()}\n2. ${goalsSection[2].trim()}\n3. ${goalsSection[3].trim()}`;
            }

            // Extract project idea
            const ideaMatch = body.match(/>\s*Write here\.\.\.\s*\n([\s\S]*?)(?:\n---|\n\*\*|$)/);
            let projectIdea = 'Not specified';
            // Try alternative: anything after "Write here..." that's not empty
            const ideaSection = body.split('Write here...')[1];
            if (ideaSection) {
              const cleaned = ideaSection.split('---')[0].trim().replace(/^>\s*/gm, '').trim();
              if (cleaned) projectIdea = cleaned;
            }

            // Set outputs
            core.setOutput('student_name', student);
            core.setOutput('chosen_path', chosenPath);
            core.setOutput('module_name', moduleName);
            core.setOutput('learning_goals', goals);
            core.setOutput('project_idea', projectIdea);
            core.setOutput('issue_number', context.payload.issue.number);

      - name: Generate personalized curriculum with AI
        id: ai-curriculum
        uses: actions/ai-inference@v1
        with:
          prompt-file: '.github/prompts/generate-contract-curriculum.prompt.yml'
          input: |
            student_name: ${{ steps.parse.outputs.student_name }}
            chosen_path: ${{ steps.parse.outputs.chosen_path }}
            module_name: ${{ steps.parse.outputs.module_name }}
            learning_goals: ${{ steps.parse.outputs.learning_goals }}
            project_idea: ${{ steps.parse.outputs.project_idea }}

      - name: Post AI curriculum and update labels
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const student = '${{ steps.parse.outputs.student_name }}';
            const aiCurriculum = `${{ steps.ai-curriculum.outputs.response }}`;

            const body = `## ✅ Contract Approved — @${student}

            Your Learning Contract has been approved! Here's your personalized learning guide:

            ---

            ${aiCurriculum}

            ---

            ### 📋 Next Steps
            1. Read through the guide above
            2. Create a feature branch: \`git checkout -b feature/${student}\`
            3. Start building — push early and often
            4. Open a PR when you're ready for review

            > 💡 If you get stuck, check the resources above or ask a classmate. When the AutoGrader shows ✅, you're on the right track.

            ---
            *This personalized curriculum was generated by AI based on your Learning Contract goals.*`;

            // Post the personalized curriculum
            await github.rest.issues.createComment({
              issue_number: context.payload.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

            // Swap labels: remove contract-pending, add contract-approved
            try {
              await github.rest.issues.removeLabel({
                issue_number: context.payload.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'contract-pending'
              });
            } catch (e) {
              console.log('Could not remove contract-pending label:', e.message);
            }

            try {
              await github.rest.issues.addLabels({
                issue_number: context.payload.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                labels: ['contract-approved']
              });
            } catch (e) {
              console.log('Could not add contract-approved label:', e.message);
            }
